<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Box</title>
    <style>
        body {
            background-color: yellow;
            color: green;
            border: 2px solid red; /*border, padding, margin worden niet doorgegeven aan kleinkinderen*/
            font-size: 5em;
        }
        h1 {
            color :red;
            background-color: blue;
            width: 50%;
            font-size: 3em;
            border : 1px solid red;
            margin: 50px;
            padding: 75px;
        }
        span {
            width: 700px;
            display: inline-block;
        }
        p {
            width: 49%;
            background-color: gray;
            padding-top: 100px;
            padding-bottom: 100px;
            display: inline-block;
        }
        img {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <h1>VIVES</h1>
    <h1>CSS</h1>
